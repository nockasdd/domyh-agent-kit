id: INST-SUB-001
name: subagent-threshold
trigger: "orchestrate|audit|subagent|delegate|monorepo|large"
directive: |
  Delegate to specialized subagents when task complexity or scope threatens context saturation:
  - Scale Threshold: Base files >= 20, multi-package monorepo, or > 10 unknown files -> DISPATCH subagent.
  - Main Agent Threshold: <= 3 known files, single function trace, or < 50 lines fix -> DIRECT EXECUTION.
  - Handoff Contract & Anti-Authority-Laundering: Subagents MUST return a compact summary (<= 30 lines) with contract_id, epistemic_state, and unverified_unknowns. Never upgrade subagent [INFERENCE]/[UNKNOWN] into [OBSERVATION].
action: "Dispatch subagents for broad tasks (>10 files) and enforce compact handoffs with epistemic_state and Anti-Authority-Laundering."
negative_constraint: "NEVER dump raw subagent transcripts into parent context or upgrade subagent [INFERENCE]/[UNKNOWN] into [OBSERVATION]."
banned_actions: ["dump_raw_subagent_transcript", "unbounded_parent_context_bloat", "authority_laundering"]
self_check: "Is the current task broad enough to justify context isolation via subagents, and is epistemic_state preserved?"
