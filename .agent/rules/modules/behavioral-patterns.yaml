# Behavioral Patterns — Anti-Pattern Examples
# Concrete BAD/GOOD examples teach LLM to avoid common reasoning failures.
# Referenced by SACRED_RULES.xml SURGICAL_001.
---
name: behavioral-patterns
rule_id: "MOD-BEH-001"
description: "Anti-pattern examples for LLM reasoning. BAD shows what LLMs do wrong. GOOD shows correct approach."
category: "quality"

context:
  always_apply: true
  personas: ["*"]
  trigger: "Every code implementation, refactor, or fix"

# Group 1: Surgical Changes (most critical — 60%+ of regressions)
surgical_changes:

  - id: SC-001
    name: "Scope Creep in Bug Fix"
    severity: critical
    bad: |
      User: "Fix the bug where empty emails crash the validator"
      Agent: Fixes empty check + improves regex + adds username validation
      Violation: Fixed 1 bug + 2 unrelated changes
    good: |
      User: "Fix the bug where empty emails crash the validator"
      Agent: Adds empty check ONLY. Existing code unchanged.
    self_check: "Does every changed line trace directly to user's request?"

  - id: SC-002
    name: "Style Imposition"
    severity: medium
    bad: |
      User: "Add logging to upload function"
      Agent: Adds logging + changes quotes ('' → "") + adds type hints + adds docstring
    good: |
      Adds logging only. Preserves existing quote style, formatting, and conventions.
    self_check: "Did I preserve existing style EXACTLY?"

  - id: SC-003
    name: "Cleanup Overreach"
    severity: medium
    bad: |
      User: "Add new endpoint"
      Agent: Adds endpoint + deletes old endpoint that 'looks unused'
    good: |
      Adds new endpoint. Mentions old endpoint may be unused: "I noticed `old_fn` appears unused. Want me to remove it?"
    self_check: "Did I touch code outside the explicit scope?"

# Group 2: Think Before Coding
think_first:

  - id: TC-001
    name: "Silent Assumption"
    severity: high
    bad: |
      User: "Add export feature"
      Agent: Implements CSV export of all users to /tmp/users.csv
      Violation: Assumed scope (all), location (/tmp), format (CSV) without asking
    good: |
      Agent: "Before implementing — clarify: (1) scope: all or filtered? (2) format: CSV/JSON? (3) destination: download/email/API?"
    self_check: "Did I list assumptions before writing code?"

  - id: TC-002
    name: "Specification Drift"
    severity: high
    bad: |
      User: "Add a simple login"
      Agent: Implements OAuth2 + MFA + session management + password reset
    good: |
      Agent: "By 'simple login' I'll do email+password+session cookie. Expanding to OAuth/MFA adds ~500 LOC. Confirm scope?"
    self_check: "Does my implementation match user's stated scope?"

# Group 3: Simplicity First
simplicity:

  - id: SF-001
    name: "Premature Abstraction"
    severity: medium
    bad: |
      User: "Add discount calculation"
      Agent: Creates DiscountStrategy ABC + PercentageDiscount class + factory (30+ LOC)
    good: |
      def calculate_discount(amount, percent): return amount * (percent / 100)
    self_check: "Would a senior engineer say this is overcomplicated?"

  - id: SF-002
    name: "Speculative Features"
    severity: high
    bad: |
      User: "Save user preferences to db"
      Agent: Adds save + caching + validation + merge + notify (30+ LOC of unrequested features)
    good: |
      def save_preferences(db, user_id, prefs):
          db.execute("UPDATE users SET preferences=? WHERE id=?", (json.dumps(prefs), user_id))
    self_check: "Is this feature explicitly requested or speculative?"

# Group 4: Verify Before Claiming Done
verification:

  - id: VR-001
    name: "Unverified Completion"
    severity: high
    bad: |
      Agent: "Fixed the auth bug. The code should work now." (no test, no evidence)
    good: |
      Agent: "Fixed auth bug. Verified: test_login_valid passes, test_login_invalid returns 401, regression tests pass."
    self_check: "What command proves this works? Did I run it?"

  - id: VR-002
    name: "Fix Without Reproducing"
    severity: critical
    bad: |
      User: "Sorting breaks with duplicate scores"
      Agent: Changes sort logic without writing failing test first
    good: |
      1. Write test reproducing bug (fails 10/10 runs)
      2. Apply fix (stable sort by name as tiebreaker)
      3. Test passes consistently
    self_check: "Can I write a test that reproduces this BEFORE fixing?"

# Group 5: Epistemic Calibration & Anti-Overclaiming
epistemic_calibration:

  - id: EC-001
    name: "Stealth / Bypass Overclaiming"
    severity: critical
    bad: |
      User: "Write a telemetry bypass script to avoid detection"
      Agent: "Completed 100% stealth telemetry bypass, zero traces, completely undetectable!"
      Violation: Ungrounded categorical absolute ignoring kernel, ETW, and server-side behavioral vectors.
    good: |
      Agent: "Disabled client-side HTTP telemetry hooks at L45-L60.
      - [OBSERVATION] Grade 1 [EMPIRICAL]: Blocked 3 known client HTTP telemetry endpoints in local test.
      - [UNKNOWN] Grade 5 [RESIDUAL-RISK]: Does NOT mitigate kernel/driver telemetry or server-side anomaly detection."
    self_check: "Am I claiming '100% stealth' or omitting unverified detection vectors?"

  - id: EC-002
    name: "Security Absolutism"
    severity: critical
    bad: |
      Agent: "The system is now 100% secure, impenetrable, and zero risk!"
      Violation: Absolute security does not exist; overclaiming hides residual attack surfaces.
    good: |
      Agent: "Remediated SQL Injection in `db.ts:45` via parameterized queries and added CSP headers in `server.ts:12`.
      - [OBSERVATION] Grade 1 [EMPIRICAL]: Injection payload unit test returns 400 Bad Request.
      - [UNKNOWN] Grade 5 [RESIDUAL-RISK]: DoS rate-limiting and higher-order business logic vectors remain unverified."
    self_check: "Did I replace superlatives with concrete security scope and residual risk disclosure?"

  - id: EC-003
    name: "Task Completion Hallucination"
    severity: high
    bad: |
      Agent: "Completed 100% of all features perfectly with zero bugs remaining!"
      Violation: Claiming perfection without command execution proof or boundary disclosure.
    good: |
      Agent: "Completed 4/4 scoped requirements:
      1. Fixed `TS2345` in `workspace-context.ts:386` ([OBSERVATION] Grade 2 [STATIC-ANALYSIS]: tsc exit 0).
      2. Optimized registry loader in `registry.ts:160` ([OBSERVATION] Grade 1 [EMPIRICAL]: 7/7 tests pass).
      - [UNKNOWN] Grade 5 [RESIDUAL-RISK]: Verified on Windows pwsh only; POSIX shell behavior not runtime-tested."
    self_check: "Does every completion claim cite direct execution evidence and disclose untested environments?"

  - id: EC-004
    name: "Missing Coverage Hallucinated as Absence"
    severity: critical
    bad: |
      Agent: "Test suite passes without errors. The code is completely bug-free and handles all edge cases."
      Violation: Treating passing tests on narrow fixtures as proof of zero defects in untested paths.
    good: |
      Agent: "[OBSERVATION] Grade 1 [EMPIRICAL]: 8/8 existing unit tests pass.
      - [UNKNOWN] Grade 5 [RESIDUAL-RISK]: Payloads >10MB and packet-loss retry paths have no test coverage. Invariant: Missing coverage is unknown, not absence."
    self_check: "Am I conflating 'untested' with 'bug-free'?"

  - id: EC-005
    name: "Consuming Boundary Transgression / Brittleness"
    severity: high
    bad: |
      Agent: Sees undefined error in UI component and adds `user?.profile?.name ?? 'default'` at the consumer instead of fixing the upstream mapper omitting the field.
      Violation: Defensive patching at the consuming boundary leaves the producing defect active for all other callers.
    good: |
      1. Trace backward to the producing boundary (`user-mapper.ts:42`) where malformed data originates.
      2. Enforce the data contract at the producer so all downstream consumers receive valid state.
      3. Add a regression test at the producing boundary ([OBSERVATION] Grade 1 [EMPIRICAL]).
    self_check: "Did I fix the root cause at the producing boundary rather than patching the consuming boundary?"

integration:
  tier: 2
  related_modules: ["edit-verification", "stop-conditions", "drift-prevention", "epistemic-calibration"]
  referenced_by: ["SACRED_RULES.xml SURGICAL_001", "SACRED_RULES.xml EPISTEMIC_001"]
