# Agent Communication Protocol v7.2.0
# Protocol for agent-to-agent communication during orchestration
# Source: A2A JSON-RPC, AutoGen messaging, OpenAI Swarm handoffs
---
name: agent-communication
rule_id: "MOD-COM-001"

description: |
  Defines how agents communicate during orchestration with strict Epistemic Quad-State preservation,
  Producing Boundary enforcement, and Anti-Authority-Laundering invariants.
  Four channels: shared state, handoff packets, event log, native subagent dispatch.

category: "workflow"

context:
  always_apply: false
  personas: ["orchestrator"]
  trigger: "When orchestration is active"

# ═══ COMMUNICATION CHANNELS ═══

channels:
  # Channel 1: Shared State (primary)
  shared_state:
    description: "All agents read/write orchestration-state.yaml"
    location: "memory/orchestration/orch-{id}.yaml"
    operations:
      read: "Any specialist can read shared_context at any time"
      write_decisions: "Specialist appends to shared_context.decisions[]"
      write_output: "Specialist writes to own task.output with epistemic_state and proof_grade"
      write_blockers: "Specialist adds to shared_context.blockers[]"

  # Channel 2: Handoff Packet (one-time injection)
  handoff:
    description: "Orchestrator → Specialist via hsa_delegate"
    when: "Task assignment in EXECUTE step"
    includes:
      - "Project snapshot (stack, structure)"
      - "Relevant files for this specific task (Producing Boundary identified)"
      - "Constraints, 6-Axis Behavioral Obligation Ledger, and conventions"
      - "Prior task outputs with preserved epistemic_state ([OBSERVATION]/[DERIVATION]/[INFERENCE]/[UNKNOWN])"
      - "Tool allow/deny list"
    max_tokens: 1500

  # Channel 3: Event Log (append-only audit trail)
  event_log:
    description: "All state changes recorded for observability"
    location: "memory/orchestration/orch-{id}.yaml → event_log[]"
    events:
      - "started: Task execution began"
      - "completed: Task finished successfully"
      - "failed: Task encountered error"
      - "retried: Task retry attempt"
      - "checkpoint: State snapshot saved"
      - "decision: Agent made architectural/technical decision"
      - "blocker: Agent cannot proceed, needs input"

  # Channel 4: Native subagent dispatch
  native_dispatch:
    description: "Hand a prepared contract to the platform's own subagent tool"
    when: "A subtask is independent enough to run without the main context"
    task_types: [code, test, review, debug, browser, research]
    lifecycle:
      1: "hsa_delegate({action:'prepare', task_type:'[type]', focus_files:[...]})"
      2: "Dispatch through the platform's native subagent tool (Agent, invoke_subagent, background agent)"
      3: "Collect compact handoff result with epistemic_state and unverified_unknowns"
      4: "hsa_delegate({action:'verify', focus_files:[...], modified_files:[...]})"
    # MANDATORY: evaluate delegation before the EXECUTE step
    mandatory_evaluation:
      trigger: "Before EXECUTE step in any workflow"
      check: "Does the platform expose a subagent tool?"
      scoring: "See delegation-intelligence skill 1% Trigger Gate"
      auto_delegate: "Complexity ≥ 8 (>200 LOC, multi-file, complex algorithm)"
      suggest_delegate: "Complexity 5-7 (>100 LOC, moderate changes)"
      skip: "Complexity < 5 or no subagent tool available"

# ═══ EPISTEMIC & ANTI-AUTHORITY-LAUNDERING INVARIANTS ═══

epistemic_invariants:
  quad_state_mapping:
    OBSERVATION: "Grade 1 [EMPIRICAL] (runtime command/test exit 0) & Grade 2 [STATIC-ANALYSIS] (typecheck/lint/AST)"
    DERIVATION: "Grade 3 [DEDUCTIVE-LOGIC] (direct structural/code deduction with file:line)"
    INFERENCE: "Grade 4 [THEORETICAL-MODEL] (unverified hypothesis/extrapolation)"
    UNKNOWN: "Grade 5 [RESIDUAL-RISK] (untested paths, missing coverage, external vectors)"
  missing_coverage_invariant: "Missing coverage is unknown, not absence."
  anti_authority_laundering: "Parent/Orchestrator MUST NEVER upgrade a specialist's [INFERENCE] or [UNKNOWN] into [OBSERVATION] or [DERIVATION] without executing independent empirical or deductive verification."
  producing_boundary_mandate: "All bugfixes and state mutations must be applied at the Producing Boundary, never via defensive workarounds at the consuming boundary."
  obligation_ledger_6_axis: ["structural", "behavioral", "boundary", "state", "error", "resource"]

# ═══ COMMUNICATION FLOW ═══

flow:
  steps:
    1: "Orchestrator creates state → writes dag.tasks[]"
    2: "For each task assignment:"
    3: "  a. Orchestrator prepares handoff packet (hsa_delegate)"
    4: "  b. Orchestrator updates task.status = 'running'"
    5: "  c. Specialist reads: handoff packet + shared_context"
    6: "  d. Specialist executes task using assigned workflow"
    7: "  e. Specialist writes: task.output (with epistemic_state & unverified_unknowns) + shared_context.decisions[]"
    8: "  f. Orchestrator reads output → preserves epistemic tags → decides next task"
    9: "After all tasks: Orchestrator synthesizes results without authority laundering"

# ═══ MESSAGE FORMAT ═══

message_format:
  from: "{persona_name}"
  to: "orchestrator | shared_context"
  type: "decision | blocker | output | request"
  epistemic_state: "[OBSERVATION] | [DERIVATION] | [INFERENCE] | [UNKNOWN]"
  proof_grade: "1..5"
  unverified_unknowns: ["{untested paths or edge cases}"]
  content: "{structured data}"
  timestamp: "{ISO}"

# ═══ STATE PERMISSIONS ═══

permissions:
  orchestrator:
    read: ["*"]
    write: ["dag", "event_log", "budget", "shared_context", "status"]
  specialist:
    read: ["shared_context", "own_task", "dependency_task.output"]
    write: ["own_task.output", "shared_context.decisions", "shared_context.blockers"]

integration:
  tier: 2
  related_modules: ["agent-delegation", "complexity-scoring", "stop-conditions", "behavioral-patterns"]
