hue_shifting_ramps_endesga32:
  description: "Pre-built 4-to-5 step hue-shifted shading ramps using exact endesga-32 hex colors (Shadow -> Mid -> Lit -> Specular)"
  ramps:
    steel_armor:  ["#181425", "#262b44", "#3a4466", "#5a6988", "#8b9bb4", "#c0cbdc", "#ffffff"]
    warm_skin:    ["#3e2731", "#733e39", "#b86f50", "#e4a672", "#ead4aa"]
    lush_foliage: ["#181425", "#193c3e", "#265c42", "#3e8948", "#63c74d", "#fee761"]
    crimson_cape: ["#181425", "#3e2731", "#68386c", "#a22633", "#e43b44", "#f77622"]
    gold_trim:    ["#3e2731", "#733e39", "#be4a2f", "#f77622", "#feae34", "#fee761", "#ffffff"]
    fire_vfx:     ["#68386c", "#a22633", "#e43b44", "#f77622", "#feae34", "#fee761", "#ffffff"]

anchor_presets:
  nes_action_16:
    canvas_size: [16, 16]
    palette: "pico-8"
    outline_mode: "none"
    directions: 4
  snes_jrpg_32:
    canvas_size: [32, 32]
    palette: "endesga-32"
    outline_mode: "sel-out"
    directions: 8
  hd_indie_boss_64:
    canvas_size: [64, 64]
    palette: "endesga-32"
    outline_mode: "sel-out"
    directions: 4
