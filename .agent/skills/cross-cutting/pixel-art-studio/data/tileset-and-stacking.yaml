      "1": "#3e2731" # Dark Wood Outline
      "2": "#733e39" # Mid Wood Plank
      "3": "#b86f50" # Lit Wood Plank
      "G": "#feae34" # Gold Band
      "L": "#fee761" # Gold Lock Highlight
    emissive_keys: ["L"]
    layers:
      # Z=0 Base Rim
      - ["11111111", "1G2222G1", "12222221", "12222221", "1G2222G1", "11111111"]
      # Z=1..2 Lower Box
      - ["1G1111G1", "1G2222G1", "12111121", "12111121", "1G3333G1", "1G1111G1"]
      - ["1G1111G1", "1G2222G1", "12111121", "12111121", "1G3333G1", "1G1111G1"]
      # Z=3 Seam & Front Clasp Lock
      - ["1G1111G1", "1G1111G1", "11111111", "111LL111", "1G1LL1G1", "1G1LL1G1"]
      # Z=4..5 Curved Lid
      - ["1G2222G1", "1G3333G1", "13333331", "13333331", "1G3333G1", "1G2222G1"]
      - [".1G33G1.", ".1G33G1.", ".133331.", ".133331.", ".1G33G1.", ".1G33G1."]

  cyber_hovercar_10x14:
