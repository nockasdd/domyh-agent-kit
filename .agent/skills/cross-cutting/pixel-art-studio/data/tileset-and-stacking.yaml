      "1": "#181425" # Chassis Dark
      "2": "#3a4466" # Hull Steel
      "3": "#e43b44" # Red Racing Fairing
      "4": "#f77622" #Lit Fairing
      "C": "#2ce8f5" # Thruster / Canopy Neon
    emissive_keys: ["C"]
    directions: 16
    generate_normal_map: true
    generate_emissive_map: true
    layers:
      # Z=0 Hover Thrusters
      - ["..CC..CC..", ".12211221.", ".12222221.", "..122221..", "..122221..", ".12222221.", ".12211221.", "..CC..CC.."]
      # Z=1 Main Body Lower
      - [".13333331.", "1344444431", "1342222431", "1342112431", "1342112431", "1342222431", "1333333331", ".1CC11CC1."]
      # Z=2 Cockpit & Fairing
      - ["..144441..", ".13444431.", ".13CCCC31.", ".13CCCC31.", ".13222231.", ".13333331.", "..133331..", "...1111..."]
      # Z=3 Roof Canopy
      - ["..........", "...1441...", "..1CCCC1..", "..1CCCC1..", "...1221...", "..........", "..........", ".........."]

  watchtower_10x10:
    palette:
      "1": "#262b44"
      "2": "#5a6988"
      "3": "#8b9bb4"
      "W": "#b86f50"
      "T": "#feae34"
    emissive_keys: ["T"]
    directions: 8
    layers_summary: "Z=0..5 stone foundation (8x8), Z=6..7 overhanging wooden battlement (10x10), Z=8 crenellations with corner torch 'T' voxels"
