# =============================================================================
# Wang 16-Tile & 47-Tile Blob Autotiles, Isometric 2:1 Math & Voxel Sprite Stacking
# =============================================================================

version: "1.0"

autotile_standards:
  wang_2_corner_dual_grid_16:
    description: "16-tile Dual-Grid Corner Wang Tileset (4x4 atlas). Render grid is offset by (+0.5, +0.5) from logical collision grid — eliminates narrow 1-tile corridor complexity!"
    bit_weights:
      NW: 8
      NE: 4
      SW: 2
      SE: 1
    atlas_layout_4x4:
      # Each cell is [col, row, mask_int, corners_active]
      - [0, 0, 0,  "none (empty)"]
      - [1, 0, 1,  "SE"]
      - [2, 0, 2,  "SW"]
      - [3, 0, 3,  "SW+SE (bottom edge)"]
      - [0, 1, 4,  "NE"]
      - [1, 1, 5,  "NE+SE (right edge)"]
      - [2, 1, 6,  "NE+SW (saddle diagonal A)"]
      - [3, 1, 7,  "NE+SW+SE (inner NW concave)"]
      - [0, 2, 8,  "NW"]
      - [1, 2, 9,  "NW+SE (saddle diagonal B)"]
      - [2, 2, 10, "NW+SW (left edge)"]
      - [3, 2, 11, "NW+SW+SE (inner NE concave)"]
      - [0, 3, 12, "NW+NE (top edge)"]
      - [1, 3, 13, "NW+NE+SE (inner SW concave)"]
      - [2, 3, 14, "NW+NE+SW (inner SE concave)"]
      - [3, 3, 15, "NW+NE+SW+SE (solid center)"]

  blob_47_autotile_8_neighbor:
    description: "Standard 47-tile 3x3 minimal autotile for Godot 4 TileMapLayer (Match Corners and Sides), Unity RuleTile, and Phaser 3"
    cardinal_weights: { N: 1, E: 4, S: 16, W: 64 }
    diagonal_weights:
      NE: { bit: 2,   valid_only_if: "N and E are both set" }
      SE: { bit: 8,   valid_only_if: "S and E are both set" }
      SW: { bit: 32,  valid_only_if: "S and W are both set" }
      NW: { bit: 128, valid_only_if: "N and W are both set" }
    canonical_47_bitmasks:
      [0, 1, 4, 5, 7, 16, 17, 20, 21, 23, 28, 29, 31, 64, 65, 68, 69, 71, 80, 81,
       84, 85, 87, 92, 93, 95, 112, 113, 116, 117, 119, 124, 125, 127, 193, 197,
       199, 209, 213, 215, 221, 223, 241, 245, 247, 253, 255]

isometric_2_to_1_projection:
  ratio: "2:1 (step 2px X per 1px Y -> 26.565 deg, NEVER 30 deg)"
  standard_tile_sizes:
    small:  { tile_w: 32, tile_h: 16, wall_z_h: 16 }
    medium: { tile_w: 64, tile_h: 32, wall_z_h: 32 }
  grid_to_screen_formula: |
    // Grid (gx, gy, gz) -> Screen Pixel (sx, sy)
    const sx = Math.round((gx - gy) * (TILE_W / 2));
    const sy = Math.round((gx + gy) * (TILE_H / 2) - gz * WALL_Z_H);
  screen_to_grid_formula: |
    const gx = Math.floor((sx / (TILE_W / 2) + sy / (TILE_H / 2)) / 2);
    const gy = Math.floor((sy / (TILE_H / 2) - sx / (TILE_W / 2)) / 2);

sprite_stacking_templates:
  description: "Ready-to-run voxel slice arrays (bottom Z=0 to top Z=N-1) for hsa_design({ action: 'sprite_stack' })"

  treasure_chest_8x8x7:
