# Three.js, React Three Fiber (R3F) & WebGPU Production Patterns
# =============================================================================

version: "1.0"

threejs_pbr_gltf_loader:
  description: "Canonical Three.js scene setup with ACESFilmic tone mapping, exact sRGB/Linear ORM wiring, and deterministic VRAM cleanup"
  code_ts: |
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/examples/jsm/loaders/DRACOLoader.js';

    export function createStudioRenderer(canvas: HTMLCanvasElement): THREE.WebGLRenderer {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      return renderer;
    }

    export function applyExternalPbrMaps(
      material: THREE.MeshStandardMaterial,
      texLoader: THREE.TextureLoader,
      paths: { baseColor: string; normal: string; orm: string; emissive?: string }
    ): void {
      const loadMap = (url: string, isSrgb: boolean): THREE.Texture => {
        const tex = texLoader.load(url);
        tex.flipY = false; // Mandatory for glTF UV coordinates!
        tex.colorSpace = isSrgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
        return tex;
      };

      const ormTex = loadMap(paths.orm, false); // R=AO, G=Roughness, B=Metalness (Linear!)
      material.map = loadMap(paths.baseColor, true);
      material.normalMap = loadMap(paths.normal, false);
      material.aoMap = ormTex;
      material.roughnessMap = ormTex;
      material.metalnessMap = ormTex;
      material.roughness = 1.0;
      material.metalness = 1.0;

      if (paths.emissive) {
        material.emissiveMap = loadMap(paths.emissive, true);
        material.emissive = new THREE.Color(0xffffff);
      }
      material.needsUpdate = true;
    }

    export function disposeHierarchy(root: THREE.Object3D): void {
      root.traverse((obj) => {
        if (!(obj instanceof THREE.Mesh)) return;
        obj.geometry?.dispose();
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        for (const mat of mats) {
          if (!mat) continue;
          for (const val of Object.values(mat)) {
            if (val instanceof THREE.Texture) val.dispose();
          }
          mat.dispose();
        }
      });
    }

instanced_mesh_batching:
  description: "10,000-instance single-draw-call scatter pattern (trees, projectiles, dungeon props)"
  code_ts: |
    import * as THREE from 'three';

    export function createInstancedField(
      geometry: THREE.BufferGeometry,
      material: THREE.Material,
      transforms: Array<{ pos: [number, number, number]; rotY: number; scale: number }>
    ): THREE.InstancedMesh {
      const mesh = new THREE.InstancedMesh(geometry, material, transforms.length);
      const dummy = new THREE.Object3D();
      for (let i = 0; i < transforms.length; i++) {
        const t = transforms[i];
        dummy.position.set(t.pos[0], t.pos[1], t.pos[2]);
        dummy.rotation.set(0, t.rotY, 0);
        dummy.scale.setScalar(t.scale);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

r3f_selective_bloom_pattern:
  description: "React Three Fiber canvas with thresholded HDR bloom (only toneMapped={false} HDR > 1.0 materials glow)"
  code_tsx: |
    import { Canvas } from '@react-three/fiber';
    import { Environment, OrbitControls, useGLTF } from '@react-three/drei';
    import { EffectComposer, Bloom } from '@react-three/postprocessing';
    import * as THREE from 'three';

    export function GameViewport({ glbUrl }: { glbUrl: string }) {
      const { scene } = useGLTF(glbUrl);
      return (
        <Canvas
          shadows
          camera={{ position: [0, 1.6, 3.8], fov: 42 }}
          gl={{ toneMapping: THREE.ACESFilmicToneMapping, outputColorSpace: THREE.SRGBColorSpace }}
        >
          <Environment preset="studio" environmentIntensity={0.65} />
          <directionalLight position={[4, 6, 4]} intensity={2.2} castShadow shadow-mapSize={[2048, 2048]} />
          <primitive object={scene} position={[0, 0, 0]} />
          {/* Example HDR VFX Core that triggers Selective Bloom without blowing out character skin */}
          <mesh position={[0.5, 1.2, 0.3]}>
            <sphereGeometry args={[0.08, 24, 24]} />
            <meshBasicMaterial color={[0.0, 3.5, 4.2]} toneMapped={false} />
          </mesh>
          <OrbitControls target={[0, 0.95, 0]} />
          <EffectComposer>
            <Bloom luminanceThreshold={1.05} mipmapBlur intensity={0.85} />
          </EffectComposer>
        </Canvas>
      );
    }

visual_scorecard_rubric:
  min_passing_average: 8.0
  axes:
    - { id: "framing",    check: "Asset occupies 55-80% of vertical frame, feet grounded, zero camera clipping" }
    - { id: "lighting",   check: "Clear key-to-fill value separation and rim silhouette read against background" }
    - { id: "materials",  check: "Metals reflect environment crisply; skin/stone/cloth show distinct roughness contrast (no plastic sheen)" }
    - { id: "silhouette", check: "Primary shapes and limbs readable at 25% thumbnail downscale" }
    - { id: "diagnostics",check: "0 WebGL shader compile errors, 0 missing texture 404s, stable frame time" }
