# =============================================================================
# Engine-Exact Export Profiles & Round-Trip Verification (Blender 3.6 / 4.x+)
# =============================================================================

version: "1.0"

profiles:
  unity:
    format: "FBX" # Also supports GLB via UnityGLTF/glTFast
    coordinate_axes: { forward: "-Z", up: "Y" }
    normal_map: "OpenGL (+Y)"
    fbx_kwargs:
      use_selection: true
      global_scale: 1.0
      apply_unit_scale: true
      apply_scale_options: "FBX_SCALE_ALL"
      bake_space_transform: true
      object_types: ["ARMATURE", "MESH"]
      use_mesh_modifiers: true
      mesh_smooth_type: "OFF"
      add_leaf_bones: false
      primary_bone_axis: "Y"
      secondary_bone_axis: "X"
      armature_nodetype: "NULL"
      bake_anim: true
      bake_anim_use_all_bones: true
      bake_anim_use_nla_strips: false
      bake_anim_use_all_actions: true
      path_mode: "COPY"
      embed_textures: true
      axis_forward: "-Z"
      axis_up: "Y"

  unreal:
    format: "FBX"
    coordinate_axes: { forward: "X", up: "Z" }
    normal_map: "DirectX (-Y green channel inverted)"
    fbx_kwargs:
      use_selection: true
      global_scale: 1.0
      apply_unit_scale: true
      apply_scale_options: "FBX_SCALE_NONE"
      bake_space_transform: false
      object_types: ["ARMATURE", "MESH"]
      use_mesh_modifiers: true
      mesh_smooth_type: "FACE" # smoothing='FACE' prevents UE5 "No smoothing group information" warning
      use_tspace: true
      add_leaf_bones: false
      primary_bone_axis: "Y"
      secondary_bone_axis: "X"
      armature_nodetype: "ROOT"
      bake_anim: true
      axis_forward: "X"
      axis_up: "Z"

  godot:
    format: "GLB"
    coordinate_axes: { standard: "glTF 2.0 (+Y Up, +Z Forward)" }
    normal_map: "OpenGL (+Y)"
    gltf_kwargs:
      export_format: "GLB"
      use_selection: true
      export_yup: true
      export_apply: false # Keep false when exporting shape keys; apply transforms beforehand!
      export_texcoords: true
      export_normals: true
      export_tangents: true
      export_materials: "EXPORT"
      export_skins: true
      export_all_influences: false
      export_morph: true
      export_morph_normal: true
      export_animations: true

  threejs:
    format: "GLB"
    coordinate_axes: { standard: "glTF 2.0 (+Y Up)" }
    normal_map: "OpenGL (+Y, texture.flipY = false)"
    gltf_kwargs:
      export_format: "GLB"
      use_selection: true
      export_yup: true
      export_apply: false
      export_texcoords: true
      export_normals: true
      export_tangents: true
      export_materials: "EXPORT"
      export_skins: true
      export_morph: true
      export_draco_mesh_compression_enable: false # Enable true (>5MB static meshes) if DRACOLoader is configured

bpy_export_and_roundtrip_script: |
  import bpy, os

  def generate_lod_chain(base_obj, ratios=(0.5, 0.2)):
      lods = [base_obj]
      base_obj.name = f"{base_obj.name}_LOD0"
      for idx, ratio in enumerate(ratios, start=1):
          dup = base_obj.copy()
          dup.data = base_obj.data.copy()
          dup.name = base_obj.name.replace("_LOD0", f"_LOD{idx}")
          bpy.context.collection.objects.link(dup)
          dec = dup.modifiers.new(name=f"Decimate_LOD{idx}", type='DECIMATE')
          dec.ratio = ratio
          bpy.context.view_layer.objects.active = dup
          if not dup.data.shape_keys:
              bpy.ops.object.modifier_apply(modifier=dec.name)
          lods.append(dup)
      return lods

  def export_for_engine(filepath, engine="godot"):
      os.makedirs(os.path.dirname(os.path.abspath(filepath)), exist_ok=True)
      engine = engine.lower()
      if engine in ("godot", "threejs"):
          bpy.ops.export_scene.gltf(
              filepath=filepath,
              export_format='GLB',
              use_selection=False,
              export_yup=True,
              export_tangents=True,
              export_skins=True,
              export_morph=True,
              export_animations=True,
          )
      elif engine == "unity":
          bpy.ops.export_scene.fbx(
              filepath=filepath,
              apply_unit_scale=True,
              apply_scale_options='FBX_SCALE_ALL',
              bake_space_transform=True,
              mesh_smooth_type='OFF',
              add_leaf_bones=False,
              embed_textures=True,
              path_mode='COPY',
              axis_forward='-Z',
              axis_up='Y',
          )
      elif engine == "unreal":
          bpy.ops.export_scene.fbx(
              filepath=filepath,
              apply_unit_scale=True,
              apply_scale_options='FBX_SCALE_NONE',
              bake_space_transform=False,
              mesh_smooth_type='FACE',
              use_tspace=True,
              add_leaf_bones=False,
              axis_forward='X',
              axis_up='Z',
          )
      else:
          raise ValueError(f"Unsupported engine profile: {engine}")
      return filepath

  def verify_glb_roundtrip(glb_path):
      bpy.ops.wm.read_factory_settings(use_empty=True)
      bpy.ops.import_scene.gltf(filepath=glb_path)
      meshes = [o for o in bpy.data.objects if o.type == 'MESH']
      arms = [o for o in bpy.data.objects if o.type == 'ARMATURE']
      bone_count = sum(len(a.data.bones) for a in arms)
      shapekey_count = max(
          (len(m.data.shape_keys.key_blocks) - 1 for m in meshes if m.data.shape_keys),
          default=0,
      )
      tri_count = sum(sum(max(0, len(p.vertices) - 2) for p in m.data.polygons) for m in meshes)
      return {
          "valid": len(meshes) > 0,
          "mesh_count": len(meshes),
          "bone_count": bone_count,
          "shapekey_count": shapekey_count,
          "triangle_count": tri_count,
      }
