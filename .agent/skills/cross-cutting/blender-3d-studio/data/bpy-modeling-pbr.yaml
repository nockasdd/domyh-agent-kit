    parameters:
      base_color: [0.82, 0.58, 0.47, 1.0]
      subsurface_weight: 0.35
      subsurface_radius: [1.0, 0.35, 0.20]
      subsurface_scale: 0.015
      pore_voronoi_scale: 180.0
      pore_bump_strength: 0.03

  woven_fabric:
    description: "Cross-wave procedural cloth/cape weave with fuzz sheen"
    metallic: 0.0
    roughness_range: [0.78, 0.92]
    parameters:
      wave_x_scale: 95.0
      wave_y_scale: 95.0
      sheen_weight: 0.45
      bump_strength: 0.06

  cel_shaded_toon_npr:
    description: "Anime / Genshin-style Cel-Shaded NPR material (ShaderToRGB stepped shadow ramp + Fresnel rim)"
    engine_note: "Use EEVEE for live viewport NPR or bake diffuse ramp to unlit sRGB texture for glTF"
    color_stops:
      shadow_stop_0: { pos: 0.00, mult: [0.48, 0.42, 0.62] }
      midtone_stop_1: { pos: 0.42, mult: [1.00, 1.00, 1.00] }
      highlight_stop_2: { pos: 0.88, mult: [1.15, 1.12, 1.05] }

orm_and_normal_baking:
  description: "Cycles deterministic baker producing BaseColor (sRGB), Normal (Linear OpenGL/DirectX), and Packed ORM (R=AO, G=Roughness, B=Metallic)"
  channel_contract:
    base_color: { colorspace: "sRGB", format: "PNG", channels: "RGBA" }
    orm:        { colorspace: "Non-Color", format: "PNG", R: "AO", G: "Roughness", B: "Metallic" }
    normal:     { colorspace: "Non-Color", format: "PNG", opengl: "+X +Y +Z", directx: "+X -Y +Z (UE5)" }
  script: |
    import bpy, os

    def bake_pbr_orm_maps(obj, out_dir, prefix="T_Asset", size=2048, directx_normal=False):
        os.makedirs(out_dir, exist_ok=True)
        scene = bpy.context.scene
        scene.render.engine = 'CYCLES'
        scene.cycles.device = 'CPU'
        scene.cycles.samples = 32
        scene.render.bake.margin = 16

        bpy.ops.object.select_all(action='DESELECT')
        obj.select_set(True)
        bpy.context.view_layer.objects.active = obj

        def make_bake_target(img_name, non_color=True):
            img = bpy.data.images.new(img_name, width=size, height=size, alpha=False)
            img.colorspace_settings.name = 'Non-Color' if non_color else 'sRGB'
            active_nodes = []
            for slot in obj.material_slots:
                if not slot.material or not slot.material.use_nodes:
                    continue
                nt = slot.material.node_tree
                tex = nt.nodes.new("ShaderNodeTexImage")
                tex.image = img
                for n in nt.nodes:
                    n.select = False
                tex.select = True
                nt.nodes.active = tex
                active_nodes.append((nt, tex))
            return img, active_nodes

        def cleanup_nodes(active_nodes):
            for nt, tex in active_nodes:
                nt.nodes.remove(tex)

        # 1. BaseColor (Diffuse Color only, no lighting)
        img_col, n_col = make_bake_target(f"{prefix}_BaseColor", non_color=False)
        scene.render.bake.use_pass_direct = False
        scene.render.bake.use_pass_indirect = False
        scene.render.bake.use_pass_color = True
        bpy.ops.object.bake(type='DIFFUSE')
        col_path = os.path.join(out_dir, f"{prefix}_BaseColor.png")
        img_col.filepath_raw = col_path
        img_col.file_format = 'PNG'
        img_col.save()
        cleanup_nodes(n_col)

        # 2. Normal Map (OpenGL +Y or DirectX -Y for UE5)
        img_nrm, n_nrm = make_bake_target(f"{prefix}_Normal", non_color=True)
        scene.render.bake.normal_space = 'TANGENT'
        scene.render.bake.normal_r = 'POS_X'
        scene.render.bake.normal_g = 'NEG_Y' if directx_normal else 'POS_Y'
        scene.render.bake.normal_b = 'POS_Z'
        bpy.ops.object.bake(type='NORMAL')
        nrm_path = os.path.join(out_dir, f"{prefix}_Normal.png")
        img_nrm.filepath_raw = nrm_path
        img_nrm.file_format = 'PNG'
        img_nrm.save()
        cleanup_nodes(n_nrm)

        # 3. Ambient Occlusion & Roughness + Metallic Channel Packing -> ORM
        img_ao, n_ao = make_bake_target("_tmp_ao", non_color=True)
        bpy.ops.object.bake(type='AO')
        cleanup_nodes(n_ao)

        img_rgh, n_rgh = make_bake_target("_tmp_rough", non_color=True)
        bpy.ops.object.bake(type='ROUGHNESS')
        cleanup_nodes(n_rgh)

        # Extract Metallic scalar from Principled BSDF (or 0.0 fallback)
        metal_val = 0.0
        if obj.material_slots and obj.material_slots[0].material:
            for node in obj.material_slots[0].material.node_tree.nodes:
                if node.type == 'BSDF_PRINCIPLED' and 'Metallic' in node.inputs:
                    metal_val = float(node.inputs['Metallic'].default_value)
                    break

        ao_px = list(img_ao.pixels)
        rgh_px = list(img_rgh.pixels)
        orm_img = bpy.data.images.new(f"{prefix}_ORM", width=size, height=size, alpha=False)
        orm_img.colorspace_settings.name = 'Non-Color'
        orm_px = [1.0] * len(ao_px)
        for i in range(0, len(ao_px), 4):
            orm_px[i]     = ao_px[i]      # R = Ambient Occlusion
            orm_px[i + 1] = rgh_px[i + 1] # G = Roughness
            orm_px[i + 2] = metal_val     # B = Metallic
            orm_px[i + 3] = 1.0
        orm_img.pixels[:] = orm_px
        orm_path = os.path.join(out_dir, f"{prefix}_ORM.png")
        orm_img.filepath_raw = orm_path
        orm_img.file_format = 'PNG'
        orm_img.save()

        bpy.data.images.remove(img_ao)
        bpy.data.images.remove(img_rgh)
        return {"base_color": col_path, "normal": nrm_path, "orm": orm_path}
